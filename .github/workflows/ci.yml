
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Tesseract and language data
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.11.2
          uv sync --locked
      - name: Run static analysis
        run: |
          uv run --locked python -m mypy app
          uv run --locked python -m flake8 --jobs=1 app tests --select E9,F63,F7,F82
      - name: Run tests with coverage
        run: uv run --locked python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Audit locked Python dependencies
        run: |
          uv export --locked --no-emit-project --no-hashes -o "$RUNNER_TEMP/requirements-audit.txt"
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements-audit.txt"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the standalone image
        run: |
          docker build --pull -t pdf-extract-service .
          docker run --detach --init --name pdf-extract-test pdf-extract-service
      - name: Verify the image health check, readiness and OCR languages
        run: |
          for attempt in {1..30}; do
            status=$(docker inspect -f '{{.State.Health.Status}}' pdf-extract-test)
            if [ "$status" = healthy ]; then break; fi
            sleep 2
          done
          test "$status" = healthy
          docker exec pdf-extract-test python -c "import os; from urllib.request import urlopen; assert os.getuid() != 0; urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"
          docker exec pdf-extract-test tesseract --list-langs | grep -x eng
          docker exec pdf-extract-test tesseract --list-langs | grep -x spa
      - name: Scan the production image and generate a full report
        run: |
          docker save -o "$RUNNER_TEMP/pdf-extract-service.tar" pdf-extract-service
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm --mount "type=bind,source=$RUNNER_TEMP,target=/audit" \
            --mount "type=bind,source=$RUNNER_TEMP/trivy-cache,target=/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 image --input /audit/pdf-extract-service.tar \
            --timeout 10m --no-progress --scanners vuln,secret --image-config-scanners misconfig,secret \
            --format json --output /audit/trivy-report.json
          docker run --rm --mount "type=bind,source=$RUNNER_TEMP,target=/audit" \
            --mount "type=bind,source=$RUNNER_TEMP/trivy-cache,target=/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 image --input /audit/pdf-extract-service.tar \
            --timeout 10m --no-progress --scanners vuln,secret --image-config-scanners misconfig,secret \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Upload full Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: ${{ runner.temp }}/trivy-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Print container logs
        if: failure()
        run: docker logs pdf-extract-test
      - name: Remove test container
        if: always()
        run: docker rm -f pdf-extract-test

  publish:
    needs: [test, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lighuen04/pdf-extract-service:latest
            ghcr.io/lighuen04/pdf-extract-service:${{ github.sha }}
